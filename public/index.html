<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Socket lifetime spike for Meta Ray-Ban Display">
<meta name="mrbd-web-app-capable" content="yes">
<link rel="icon" href="character.png" sizes="600x600">
<title>Socket spike</title>
<style>
  /* Fill whatever viewport the device actually reports rather than
     asserting 600px. The meta tag locks the scale; this keeps the layout
     inside the frame even if the reported size is not exactly 600. */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
    color: #f2e8d2;
  }
  #stage { position: fixed; inset: 0; padding: 20px; box-sizing: border-box;
           display: flex; flex-direction: column; align-items: center; }
  /* Smaller mark, so the text starts higher in the frame. */
  #char { width: 96px; height: 96px; image-rendering: pixelated; flex-shrink: 0; }
  #char.thinking { opacity: 0.55; }
  #state { font-size: 30px; font-weight: 600; margin: 8px 0 4px;
           letter-spacing: 0.02em; color: #ffffff; }
  #state.live { color: #ffffff; }
  #state.down { color: #ffc24d; }
  #nums { font-size: 18px; font-weight: 500; color: #ffe9c4; margin-bottom: 12px; }
  /* Absorbs the leftover space instead of demanding a fixed 150px, which
     pushed the button off the bottom when the frame came up short. */
  #log { font-size: 16px; font-weight: 500; color: #d9c9a4; line-height: 1.5;
         width: 100%; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .focusable { font-size: 20px; font-weight: 500; border: 3px solid transparent;
               border-radius: 7px; padding: 10px 14px; width: 100%;
               box-sizing: border-box; text-align: center;
               color: #ffe9c4; background: none; }
  .focusable:focus { outline: none; border-color: #ffffff; color: #ffffff; }
  #idle { display: flex; flex-direction: column; align-items: center;
          flex: 1 1 auto; min-height: 0; width: 100%; }
  #idle #imu { margin-top: auto; flex-shrink: 0; }
  /* The resting state: the character, one line, and how fresh it is.
     Nothing else earns a place on a surface you leave open all day. */
  #ambient { font-size: 30px; font-weight: 600; color: #ffffff;
             text-align: center; margin-top: 26px; }
  #since { font-size: 18px; font-weight: 500; color: #ffe9c4; margin-top: 10px; }
  #debug { width: 100%; flex: 1 1 auto; min-height: 0; margin-top: 16px;
           display: flex; flex-direction: column; align-items: center; }
  /* The card takes the whole surface. One decision at a time, never a
     card competing with the telemetry readout behind it. */
  #card { width: 100%; flex: 1 1 auto; min-height: 0; overflow: hidden;
          display: flex; flex-direction: column; }
  /* Hierarchy comes from size and weight, never from dimness. A mid-grey
     is the worst case on an additive display: too faint to read outdoors,
     still bright enough to haze the view behind it. */
  #cardLabel { font-size: 18px; font-weight: 700; letter-spacing: 0.12em;
               color: #ffc98a; margin-bottom: 12px; }
  #cardBody { font-size: 34px; font-weight: 600; line-height: 1.25;
              color: #ffffff; margin-bottom: 24px; }
  /* What dwelling reveals. Warm rather than white so it reads as the
     character's own voice and not another line of the card. */
  #cardMore { font-size: 24px; font-weight: 500; line-height: 1.35;
              color: #ffd79a; margin: -8px 0 22px; }
  #cardMore.pending { color: #b9a982; }
  /* The catch-up. Nothing can wake this display, so returning to it is the
     moment the wearer finds out what happened — one screen, not a stack of
     cards to pinch through. */
  #digest { width: 100%; flex: 1 1 auto; min-height: 0; overflow: hidden;
            display: flex; flex-direction: column; }
  #digestLabel { font-size: 18px; font-weight: 700; letter-spacing: 0.12em;
                 color: #ffc98a; margin-bottom: 16px; }
  #digestRows { display: flex; flex-direction: column; gap: 2px; margin-bottom: 20px; }
  #digestRows .row { display: flex; justify-content: space-between; gap: 16px;
                     font-size: 24px; font-weight: 500; color: #f2e8d2;
                     padding-bottom: 12px; border-bottom: 2px solid #2a2721; }
  #digestRows .row span:first-child { overflow: hidden; text-overflow: ellipsis;
                                      white-space: nowrap; }
  #digestRows .row .when { color: #9c9483; flex-shrink: 0; }
  #digestRows .row .needs { color: #ffffff; font-weight: 600; flex-shrink: 0; }
  #cardOpts { display: flex; flex-direction: column; gap: 12px; }
  #cardOpts .focusable { font-size: 26px; padding: 16px 22px; text-align: left; }
</style>
</head>
<body>
<div id="stage">
  <img id="char" src="character.png" alt="">

  <div id="card" hidden>
    <div id="cardLabel"></div>
    <div id="cardBody"></div>
    <div id="cardMore" hidden></div>
    <div id="cardOpts"></div>
  </div>

  <div id="digest" hidden>
    <div id="digestLabel">WHILE YOU WERE OUT</div>
    <div id="digestRows"></div>
    <div id="digestOpts"></div>
  </div>

  <div id="idle">
    <div id="ambient">Nothing needs you</div>
    <div id="since">connecting</div>
    <button class="focusable" id="imu" hidden>Pinch to enable sensors</button>
    <!-- Instrumentation keeps running either way; the server log is what
         the backgrounding test reads. Append ?debug=1 to see it on glass. -->
    <div id="debug" hidden>
      <div id="state" class="down">connecting</div>
      <div id="nums">--</div>
      <div id="log"></div>
    </div>
  </div>
</div>
<script>
(function () {
  // The display id must match the one the connector derives from the
  // credential, or cards are written where this page never looks. Until QR
  // pairing exists it comes from the URL and is remembered — the same
  // shape the claim URL will take. Get the value from GET /whoami.
  var SESSION = (function () {
    var q = new URLSearchParams(location.search).get('s');
    try {
      if (q) { localStorage.setItem('spike.session', q); return q; }
      return localStorage.getItem('spike.session') || 'unpaired';
    } catch (e) { return q || 'unpaired'; }
  })();
  var T0 = Date.now();
  var LS_KEY = 'spike.events';
  var beacons = 0;

  var elState = document.getElementById('state');
  var elNums  = document.getElementById('nums');
  var elLog   = document.getElementById('log');
  var elChar  = document.getElementById('char');
  var elIdle  = document.getElementById('idle');
  var elAmb   = document.getElementById('ambient');
  var elSince = document.getElementById('since');
  var elDebug = document.getElementById('debug');
  var elImu   = document.getElementById('imu');
  var elCard  = document.getElementById('card');
  var elLabel = document.getElementById('cardLabel');
  var elBody  = document.getElementById('cardBody');
  var elOpts  = document.getElementById('cardOpts');
  var elMore  = document.getElementById('cardMore');
  var elDigest = document.getElementById('digest');
  var elRows   = document.getElementById('digestRows');
  var elDigestOpts = document.getElementById('digestOpts');

  function secs() { return Math.round((Date.now() - T0) / 1000); }

  // Buffer events locally so nothing is lost while the socket is down,
  // and so a kill/relaunch still yields a record.
  function buffer(ev) {
    try {
      var all = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
      all.push(ev);
      if (all.length > 400) all = all.slice(-400);
      localStorage.setItem(LS_KEY, JSON.stringify(all));
    } catch (e) { /* storage can throw; the run still works */ }
  }

  function drain() {
    var all = [];
    try { all = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) {}
    if (!all.length) return;
    fetch('/api/flush', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: SESSION, events: all })
    }).then(function () {
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
    }).catch(function () { /* retry on next connect */ });
  }

  function mark(kind, detail) {
    var ev = { t: Date.now(), at: secs(), kind: kind, detail: detail || '',
               vis: document.visibilityState, session: SESSION };
    buffer(ev);
    show(kind + (detail ? ' ' + detail : ''));
  }

  function show(line) {
    var d = document.createElement('div');
    d.textContent = secs() + 's  ' + line;
    elLog.insertBefore(d, elLog.firstChild);
    while (elLog.children.length > 9) elLog.removeChild(elLog.lastChild);
  }

  function ago(ms) {
    var s = Math.round(ms / 1000);
    if (s < 10) return 'just now';
    if (s < 60) return s + 's ago';
    var m = Math.round(s / 60);
    return m === 1 ? 'a minute ago' : m + ' min ago';
  }

  function paint() {
    elSince.textContent = lastCheck ? 'checked ' + ago(Date.now() - lastCheck)
                                    : 'connecting';
    elState.textContent = lastCheck ? 'polling' : 'starting';
    elState.className = lastCheck ? 'live' : 'down';
    elNums.textContent = secs() + 's  beacon ' + beacons;
  }

  function probe() {
    // Report the frame the device actually gives us, rather than assuming
    // it matches the 600x600 the docs specify.
    mark('viewport', window.innerWidth + 'x' + window.innerHeight
                   + ' dpr' + (window.devicePixelRatio || 1)
                   + ' screen' + screen.width + 'x' + screen.height);
    mark('has-fetch', typeof fetch);
  }

  // --- card loop ------------------------------------------------------
  // Short-poll, not long-poll. A serverless function caps how long a
  // request may live, and a second or two of latency is nothing against
  // an agent whose cadence is minutes. Backs off while nothing happens.
  var queue = [], showing = null, lastCheck = 0, digesting = false;

  // Back off on visibility, not on elapsed quiet. The old time-based
  // ladder dropped to 12s after a few idle minutes, so the first card
  // after a quiet spell could take 12s to appear — burning half the
  // agent's wait window before the wearer had seen anything. If the
  // surface is in view, someone is there: poll fast. If it is hidden,
  // nobody is looking and cheap is fine.
  function pollDelay() {
    return document.visibilityState === 'visible' ? 2000 : 15000;
  }

  function poll() {
    fetch('/api/pending?s=' + SESSION)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        lastCheck = Date.now();
        var cards = (d && d.cards) || [];
        if (!cards.length) { paint(); return; }
        mark('cards', String(cards.length));
        queue = queue.concat(cards);
        if (digesting || showing) return;
        // More than one thing waiting means the wearer has been away.
        if (queue.length > 1) showDigest(); else next();
      })
      .catch(function () { /* offline is not an error here */ })
      .then(function () { setTimeout(poll, pollDelay()); });
  }

  // --- the catch-up ----------------------------------------------------
  // When several things are waiting, showing them one at a time makes the
  // wearer pinch through a backlog to find the one that matters. A single
  // screen says what happened and what still needs them; only decisions
  // then get a card of their own.
  function clockOf(ts) {
    if (!ts || Date.now() - ts < 120000) return 'now';
    var d = new Date(ts);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function ack(ticket) {
    fetch('/api/ack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ticket: ticket })
    }).catch(function () {});
  }

  function showDigest() {
    digesting = true;
    resetDwell();
    elCard.hidden = true;
    elIdle.hidden = true;
    elDigest.hidden = false;
    elRows.textContent = '';
    elDigestOpts.textContent = '';

    var decisions = 0;
    queue.slice(0, 5).forEach(function (c) {
      var row = document.createElement('div');
      row.className = 'row';
      var what = document.createElement('span');
      what.textContent = c.kind === 'notify' ? c.line : c.body;
      var when = document.createElement('span');
      if (c.kind === 'notify') {
        when.className = 'when';
        when.textContent = clockOf(c.at);
        ack(c.ticket);            // reading it here counts as seeing it
      } else {
        when.className = 'needs';
        when.textContent = 'needs you';
        decisions++;
      }
      row.appendChild(what);
      row.appendChild(when);
      elRows.appendChild(row);
    });

    var b = document.createElement('button');
    b.className = 'focusable';
    b.textContent = decisions
      ? (decisions === 1 ? 'Review it' : 'Review ' + decisions)
      : 'Got it';
    b.addEventListener('click', function () {
      digesting = false;
      elDigest.hidden = true;
      // The lines have been read; only decisions still deserve a card.
      queue = queue.filter(function (c) { return c.kind !== 'notify'; });
      next();
    });
    elDigestOpts.appendChild(b);
    b.focus();
    setTimeout(function () { if (digesting) b.focus(); }, 80);
    mark('digest', String(queue.length));
  }

  function next() {
    showing = queue.shift() || null;
    // A new card means the previous dwell is meaningless.
    resetDwell();
    elMore.hidden = true;
    elMore.textContent = '';
    if (!showing) {
      elCard.hidden = true;
      elIdle.hidden = false;
      return;
    }
    var card = showing;
    // The ticket tail disambiguates two cards whose text reads identically.
    // Without it a wearer cannot tell which one they are answering.
    elLabel.textContent = (card.title || '') +
      (card.ticket ? '  · ' + card.ticket.slice(-4) : '');

    // Tell the server it is actually on screen. Delivery to the poll queue
    // is not the same as being rendered, and only the client knows which.
    ack(card.ticket);
    elBody.textContent = card.kind === 'notify'
      ? card.line
      : card.body + (card.detail ? ' — ' + card.detail : '');
    elOpts.textContent = '';
    elIdle.hidden = true;
    elCard.hidden = false;

    // A dim line asks nothing of the wearer, so it clears itself.
    if (card.kind === 'notify') {
      setTimeout(function () { if (showing === card) next(); }, 6000);
      return;
    }

    (card.options || []).forEach(function (label, i) {
      var b = document.createElement('button');
      b.className = 'focusable';
      b.textContent = label;
      b.addEventListener('click', function () { answer(card, label, i); });
      elOpts.appendChild(b);
    });
    // Focus twice: once now, once after the element has actually been laid
    // out. The second call is what makes the first pinch land reliably.
    var first = elOpts.querySelector('.focusable');
    if (first) {
      first.focus();
      setTimeout(function () { if (showing === card) first.focus(); }, 80);
    }
  }

  // --- dwell to think --------------------------------------------------
  // Head stillness is an involuntary, zero-effort input: holding your gaze
  // on something IS the signal that you want more of it. The ladder spends
  // nothing on a glance and escalates only while attention persists.
  //
  //   ~600ms   reveal the detail the agent already attached (free, local)
  //   ~1400ms  ask Muse Spark at minimal effort, which lands ~4s later
  //
  // The ladder stops there on purpose. Measured round trips were 4s at
  // minimal, 12s at low, 14s at medium and over 20s above that — and
  // nobody holds their gaze on a heads-up display for twelve seconds.
  // Latency, not reasoning depth, is what bounds thinking on this surface.
  //
  // Looking away aborts whatever is in flight and resets the ladder, so an
  // abandoned card never bills for reasoning nobody reads.
  var STILL_DEG = 2.0;       // per-sample movement under this counts as still
  var TIER_MS = [600, 1400];
  var stillSince = 0, lastOri = null, tier = 0, inflight = null;

  function resetDwell() {
    stillSince = 0;
    tier = 0;
    if (inflight) { inflight.abort(); inflight = null; }
    elChar.classList.remove('thinking');
  }

  function onOrientation(e) {
    var cur = { a: e.alpha || 0, b: e.beta || 0, g: e.gamma || 0 };
    if (lastOri) {
      var da = Math.abs(cur.a - lastOri.a);
      if (da > 180) da = 360 - da;            // alpha wraps at 0/360
      var moved = da + Math.abs(cur.b - lastOri.b) + Math.abs(cur.g - lastOri.g);
      if (moved < STILL_DEG) {
        if (!stillSince) stillSince = Date.now();
      } else if (stillSince) {
        resetDwell();
      }
    }
    lastOri = cur;
  }

  function dwellTick() {
    if (!showing || showing.kind === 'notify' || !stillSince) return;
    var held = Date.now() - stillSince;

    if (tier === 0 && held > TIER_MS[0]) {
      tier = 1;
      if (showing.detail) {
        elMore.textContent = showing.detail;
        elMore.className = '';
        elMore.hidden = false;
      }
    }
    if (tier === 1 && held > TIER_MS[1]) { tier = 2; askSpark('minimal'); }
  }

  function askSpark(effort) {
    var card = showing;
    if (!card) return;
    if (inflight) inflight.abort();
    inflight = new AbortController();
    elChar.classList.add('thinking');
    elMore.textContent = 'thinking…';
    elMore.className = 'pending';
    elMore.hidden = false;
    mark('dwell', effort);

    fetch('/api/think', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ card: card, effort: effort }),
      signal: inflight.signal
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (showing !== card) return;          // they moved on; drop it
        if (d && d.ok && d.text) {
          elMore.textContent = d.text;
          elMore.className = '';
          mark('thought', effort);
        } else {
          // No key, or upstream trouble. Fall back to what we already had
          // rather than leaving "thinking…" on the glass.
          elMore.textContent = card.detail || '';
          elMore.className = '';
          elMore.hidden = !card.detail;
          mark('think-fail', (d && d.reason) || 'unknown');
        }
      })
      .catch(function () { /* aborted by look-away, or offline */ })
      .then(function () { elChar.classList.remove('thinking'); });
  }

  setInterval(dwellTick, 200);

  function answer(card, choice, index) {
    mark('pinch', choice);
    fetch('/api/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ticket: card.ticket, choice: choice, index: index })
    })
      .then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        mark('pinch-ok', choice);
        next();
      })
      .catch(function () {
        // A lost answer must never look like a delivered one. Keep the card
        // up and say so, rather than advancing as if it went through.
        mark('pinch-fail', choice);
        elMore.textContent = 'not sent — pinch again';
        elMore.className = 'pending';
        elMore.hidden = false;
      });
  }

  // The beacon is the liveness record the backgrounding test reads: if it
  // keeps arriving while the app is out of view, the page is still running.
  setInterval(paint, 5000);

  setInterval(function () {
    beacons++;
    fetch('/api/beacon?s=' + SESSION + '&n=' + beacons + '&at=' + secs()
          + '&vis=' + document.visibilityState).catch(function () {});
  }, 5000);

  document.addEventListener('visibilitychange', function () {
    mark('visibility', document.visibilityState);
    elChar.className = document.visibilityState === 'visible' ? '' : 'thinking';
  });
  window.addEventListener('pagehide', function () { mark('pagehide'); });
  window.addEventListener('pageshow', function () { mark('pageshow'); });
  window.addEventListener('freeze', function () { mark('freeze'); });
  window.addEventListener('resume', function () { mark('resume'); });
  window.addEventListener('online', function () { mark('online'); });
  window.addEventListener('offline', function () { mark('offline'); });

  // The IMU permission must come from a user gesture, so dwell-to-think
  // needs this pinch before head stillness can be read.
  // Starts the orientation feed that dwell-to-think reads. Called from the
  // grant button, and again on later loads once the grant is remembered —
  // otherwise dwell would only ever work in the session you first allowed it.
  var imuRunning = false;
  function startIMU() {
    if (imuRunning) return;
    imuRunning = true;
    window.addEventListener('deviceorientation', function once(e) {
      mark('imu-ok', 'alpha=' + Math.round(e.alpha || 0));
      try { localStorage.setItem('spike.imu', 'ok'); } catch (err) {}
      elImu.hidden = true;
      window.removeEventListener('deviceorientation', once);
    });
    window.addEventListener('deviceorientation', onOrientation);
  }

  elImu.addEventListener('click', function () {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function (s) {
        mark('imu-perm', s);
        if (s === 'granted') startIMU();
      }).catch(function () { mark('imu-perm', 'error'); });
    } else {
      mark('imu-perm', 'implicit');
      startIMU();
    }
  });

  document.addEventListener('keydown', function (e) {
    // Only what is actually on screen: a hidden card's buttons must not
    // capture the D-pad from the view the wearer can see.
    var f = Array.prototype.slice.call(document.querySelectorAll('.focusable'))
              .filter(function (el) { return el.offsetParent !== null; });
    if (!f.length) return;
    var i = f.indexOf(document.activeElement);
    switch (e.key) {
      case 'ArrowUp': case 'ArrowLeft':
        f[i > 0 ? i - 1 : f.length - 1].focus(); break;
      case 'ArrowDown': case 'ArrowRight':
        f[i < f.length - 1 ? i + 1 : 0].focus(); break;
      case 'Enter':
        mark('enter', document.activeElement && document.activeElement.textContent
          ? document.activeElement.textContent.slice(0, 20) : 'nothing-focused');
        var active = document.activeElement;
        if (active && active.classList.contains('focusable')) {
          active.click();
        } else if (f.length) {
          // Focus does not always land on an element that was revealed a
          // moment ago in this webview. A pinch must still commit the
          // default rather than silently doing nothing.
          f[0].focus();
          f[0].click();
        }
        break;
      case 'Escape': mark('escape'); break;
      default: return;
    }
    e.preventDefault();
  });

  // Ask for the sensor grant only until it has been given, and keep the
  // diagnostics one query parameter away rather than on the resting screen.
  try {
    elImu.hidden = localStorage.getItem('spike.imu') === 'ok';
  } catch (e) { elImu.hidden = false; }
  if (new URLSearchParams(location.search).has('debug')) elDebug.hidden = false;
  if (elImu.hidden) startIMU();

  mark('load');
  probe();
  drain();
  poll();
  paint();
})();
</script>
</body>
</html>
